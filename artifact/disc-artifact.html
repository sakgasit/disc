<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DISC Personality Assessment</title>
<meta name="description" content="Free DISC personality assessment in English and Thai, with a live classroom board.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='50' height='50' fill='%23e5484d'/><rect x='50' width='50' height='50' fill='%23f5a524'/><rect y='50' width='50' height='50' fill='%233e63dd'/><rect x='50' y='50' width='50' height='50' fill='%2330a46c'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --D:#e5484d; --I:#f5a524; --S:#30a46c; --C:#3e63dd;
  --bg:#f7f6f3; --card:#ffffff; --ink:#1c1c1e; --muted:#6b6b70; --line:#e6e4df;
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121214; --card:#1c1c1f; --ink:#f2f2f3; --muted:#a0a0a8; --line:#2c2c31; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", Helvetica, Arial, sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
html[lang="th"] body{font-family:"Noto Sans Thai", ui-sans-serif, system-ui, sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 64px}
header.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:24px}
.home{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.logo{display:grid;grid-template-columns:1fr 1fr;width:30px;height:30px;border-radius:7px;overflow:hidden}
.logo span:nth-child(1){background:var(--D)} .logo span:nth-child(2){background:var(--I)}
.logo span:nth-child(3){background:var(--C)} .logo span:nth-child(4){background:var(--S)}
.brand b{font-size:18px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}

#view > * + *{margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px}
h1{font-size:clamp(26px,5vw,38px);line-height:1.2;margin:0 0 12px}
h2{font-size:22px;margin:0 0 8px;line-height:1.3}
h3{font-size:17px;margin:20px 0 6px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}
.quad div{border-radius:12px;padding:14px;color:#fff;line-height:1.4}
.quad strong{display:block;font-size:22px}
.quad small{opacity:.92}
.btn{
  appearance:none;border:0;border-radius:999px;padding:13px 24px;font:inherit;font-size:15px;font-weight:600;
  background:var(--ink);color:var(--bg);cursor:pointer;transition:transform .1s, opacity .2s;white-space:nowrap;
}
.btn:hover{opacity:.9} .btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:10px 16px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.nowrap{flex-wrap:nowrap}
.between{justify-content:space-between}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}

/* forms */
.lbl{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px;letter-spacing:.3px}
.input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.input:focus{outline:2px solid var(--C);outline-offset:1px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.err{color:var(--D);font-size:14px;font-weight:600;min-height:1.2em;margin:10px 0}

/* quiz */
.badge{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;margin-bottom:14px}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 22px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--D),var(--I),var(--S),var(--C));transition:width .3s}
.qcount{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.qtext{font-size:clamp(20px,3.6vw,26px);font-weight:600;margin:6px 0 24px;min-height:2.6em;line-height:1.4}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{
  border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;
  padding:14px 6px;cursor:pointer;font:inherit;font-size:13px;font-weight:500;transition:all .15s;
  display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;line-height:1.3;
}
.scale .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);flex:none}
.scale button:hover{border-color:var(--ink)}
.scale button.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scale button.sel .dot{background:var(--bg);border-color:var(--bg)}
@media (max-width:560px){
  .scale{grid-template-columns:1fr}
  .scale button{flex-direction:row;justify-content:flex-start;padding:14px 16px;font-size:15px;text-align:left}
  .hide-mobile{display:none}
  .card{padding:20px}
}

/* results */
.hero{border-radius:var(--radius);padding:26px;color:#fff}
.hero .tag{font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.9}
.hero h1{color:#fff;margin:6px 0 6px}
.bars{display:grid;gap:14px;margin:8px 0 6px}
.bar label{display:flex;justify-content:space-between;font-weight:600;font-size:14px;margin-bottom:6px;gap:8px}
.bar .track{height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;width:0;border-radius:99px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
ul{margin:0;padding-left:20px} li{margin:4px 0}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:800;color:#fff;vertical-align:middle}
.wheel{display:block;margin:6px auto 0;max-width:260px;width:100%;color:var(--ink)}
.status{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.status p{margin:0;font-weight:600}

/* board */
.invite{display:flex;gap:20px;flex-wrap:wrap;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.qrbox{flex:none;width:190px;height:190px;padding:0;border:0;border-radius:12px;overflow:hidden;background:#fff;cursor:zoom-in}
.qrbox svg,.qr-big svg{display:block;width:100%;height:100%}
.invite-info{flex:1;min-width:220px}
.invite-info .lbl{margin-top:0}
.invite-info .hint + .lbl{margin-top:14px}
.linkdetails{margin-top:12px;font-size:14px}
.linkdetails summary{cursor:pointer;color:var(--muted);margin-bottom:8px}
@media (max-width:560px){.qrbox{width:100%;height:auto;aspect-ratio:1;max-width:280px;margin:0 auto}}
.qr-overlay{position:fixed;inset:0;z-index:50;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;cursor:zoom-out}
.qr-big{width:min(78vmin,560px);aspect-ratio:1;background:#fff;border-radius:16px;overflow:hidden}
.qr-name{font-size:clamp(22px,4vw,34px);font-weight:800;margin-top:18px}
.code{font-size:34px;font-weight:800;letter-spacing:4px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.invite .input{font-size:14px;padding:10px 12px;background:var(--card)}
.live{color:var(--S);font-weight:700}
.map{display:block;width:100%;max-width:520px;margin:10px auto 4px;color:var(--ink);border-radius:12px}
.map .nm{font-size:11px;font-weight:700;fill:currentColor;paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
.map .ax{font-size:11px;fill:currentColor;opacity:.6;font-weight:600}
.legend{text-align:center;font-size:13px;color:var(--muted);white-space:pre}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;margin:6px 0 4px}
.toggle input{width:20px;height:20px;accent-color:var(--ink)}
.chip.danger{background:var(--D);border-color:var(--D);color:#fff;font-weight:700}
.linkbtn{border:0;background:none;padding:0;font:inherit;color:var(--C);text-decoration:underline;cursor:pointer}

footer{margin-top:36px;font-size:13px;color:var(--muted);text-align:center}
@media print{
  .noprint, header .seg{display:none !important}
  body{background:#fff;color:#000}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <a class="home" href="./" data-home>
      <div class="logo"><span></span><span></span><span></span><span></span></div>
      <b>DISC Profile</b>
    </a>
    <div class="seg" role="group" aria-label="Language">
      <button data-lang="en">EN</button><button data-lang="th">ไทย</button>
    </div>
  </header>
  <main id="view"></main>
  <footer id="foot"></footer>
</div>
<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';

<script>
// Artifact adapter: routes in the #hash, data in the artifact's shared database.
(() => {
  const PAGE_URL = "https://claude.ai/artifact/25mq9VQ5Y5EXBa7uHDrfcd";
  const CODE_RE = /^[A-Z0-9]{6}$/;
  const ALPHABET = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";

  window.DISC_ENV = {
    canPrint: false,
    canShare: false,
    route: {
      read() {
        const h = decodeURIComponent(location.hash.slice(1));
        const i = h.indexOf("-");
        if (i < 0) return { kind: "", val: "" };
        return { kind: h.slice(0, i), val: h.slice(i + 1) };
      },
      write(kind, val) {
        try { history.replaceState(null, "", kind ? `#${kind}-${val}` : location.pathname + location.search); } catch (e) {}
      }
    },
    link: (kind, val) => `${PAGE_URL}#${kind}-${val}`
  };

  let db = null, myId = null, owner = false;
  const waitForClaude = async () => {
    for (let i = 0; i < 30 && !(window.claude && window.claude.use); i++) await new Promise(r => setTimeout(r, 100));
    return window.claude && window.claude.use ? window.claude : null;
  };
  const readyP = (async () => {
    try {
      const claude = await waitForClaude();
      if (!claude) return false;
      db = await claude.use("db");
      const user = await claude.use("user");
      if (user) {
        try { myId = await user.id(); } catch (e) {}
        try { owner = !!(await user.isOwner()); } catch (e) {}
      }
    } catch (e) { db = null; }
    return !!db;
  })();

  const fail = e => {
    const err = new Error(e && e.message || "db");
    err.code = e && e.code === "invalid_argument" ? "perm" : e && e.code === "quota_exceeded" ? "full" : "net";
    return err;
  };
  const cleanNick = s => String(s ?? "").replace(/[\u0000-\u001f<>]/g, "").trim().slice(0, 20);
  const validScores = s => s && ["D", "I", "S", "C"].every(k => Number.isInteger(s[k]) && s[k] >= 0 && s[k] <= 100);

  window.DISC_BACKEND = {
    ready: () => readyP,

    async createClass(rawName) {
      const name = String(rawName).replace(/[\u0000-\u001f<>]/g, "").trim().slice(0, 60);
      try {
        for (let i = 0; i < 8; i++) {
          const code = Array.from(crypto.getRandomValues(new Uint8Array(6)), b => ALPHABET[b % ALPHABET.length]).join("");
          const ref = db.doc("classes/" + code);
          if ((await ref.get()).exists) continue;
          await ref.set({ name, created: Date.now(), creator: myId || "", showNames: true });
          return { code, name };
        }
      } catch (e) { throw fail(e); }
      throw fail(null);
    },

    async getClass(code) {
      if (!CODE_RE.test(code)) return null;
      const s = await db.doc("classes/" + code).get();
      return s.exists ? { name: String(s.data().name || code) } : null;
    },

    subscribe(code, onData, onErr) {
      let meta, metaKnown = false, members = null, done = false;
      const timer = setTimeout(() => { if (!metaKnown || members === null) onErr("net"); }, 10000);
      const emit = () => {
        if (!metaKnown || members === null || done) return;
        if (!meta) return onErr("notFound");
        onData({
          name: String(meta.name || code),
          showNames: meta.showNames !== false,
          isAdmin: owner || (!!myId && meta.creator === myId),
          members
        });
      };
      const u1 = db.doc("classes/" + code).onSnapshot(s => {
        if (!s.exists && s.metadata.fromCache) return; // wait for the server's answer
        metaKnown = true; meta = s.exists ? s.data() : null;
        if (!s.metadata.fromCache) clearTimeout(timer);
        emit();
      }, () => onErr("net"));
      const u2 = db.collection(`classes/${code}/members`).onSnapshot(s => {
        members = s.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() }))
          .filter(m => validScores(m.scores) && cleanNick(m.nick))
          .map(m => ({ id: m.id, nick: cleanNick(m.nick), scores: m.scores, at: m.at || 0 }))
          .sort((a, b) => a.at - b.at);
        emit();
      }, () => onErr("net"));
      return () => { done = true; clearTimeout(timer); u1(); u2(); };
    },

    async join(code, m, scores) {
      try {
        await db.doc(`classes/${code}/members/${m.id}`).set({ nick: cleanNick(m.nick), scores, at: Date.now() });
      } catch (e) { throw fail(e); }
    },

    async remove(code, id) {
      try { await db.doc(`classes/${code}/members/${id}`).delete(); } catch (e) { throw fail(e); }
    },

    async setShowNames(code, showNames) {
      try { await db.doc("classes/" + code).update({ showNames: !!showNames }); } catch (e) { throw fail(e); }
    }
  };

  window.DISC_ENV.onRouteChange = fn => window.addEventListener("hashchange", fn);
})();
</script>

  const rank = sc => ORDER.slice().sort((a, b) => sc[b] - sc[a] || ORDER.indexOf(a) - ORDER.indexOf(b));

  const S = { idx: 0, answers: [], cls: null, render: null, actions: {}, unsub: null, nav: 0,
              lock: false, submit: null, boards: {}, classes: {}, boardErr: null, confirmId: null };

  function go(fn) {
    if (S.unsub) { S.unsub(); S.unsub = null; }
    S.nav++; S.confirmId = null;
    S.render = fn; fn(); window.scrollTo(0, 0);
  }
  const bind = map => { S.actions = map; };
  view.addEventListener("click", e => {
    const el = e.target.closest("[data-a]");
    if (!el || !view.contains(el)) return;
    const f = S.actions[el.dataset.a];
    if (f) f(el);
  });

  const memberRec = code => LS.get("disc-member-" + code);
  function ensureMember(code, nick) {
    const m = memberRec(code) || { id: rid(), token: rid() };
    m.nick = nick; LS.set("disc-member-" + code, m); return m;
  }
  const myClasses = () => (LS.get("disc-my-classes") || []).filter(c => CODE_RE.test(c.code));
  function rememberClass(code, name) {
    LS.set("disc-my-classes", [{ code, name }, ...myClasses().filter(c => c.code !== code)].slice(0, 12));
  }

  function setLang(l, rerender = true) {
    lang = l; LS.set("disc-lang", l);
    document.documentElement.lang = l;
    document.title = t("title");
    document.querySelectorAll("[data-lang]").forEach(b => b.classList.toggle("on", b.dataset.lang === l));
    $("#foot").textContent = t("footer");
    if (rerender && S.render) {
      const keep = [...view.querySelectorAll("input[id]:not([readonly])")].map(i => [i.id, i.value]);
      S.render();
      keep.forEach(([id, v]) => { const i = document.getElementById(id); if (i) i.value = v; });

  }

  const msgCard = (msg, extra = "") => `
    <section class="card"><p class="err">${msg}</p>

  const loadingCard = () => `<section class="card"><p class="muted" style="margin:0">${t("loading")}</p></section>`;

  async function needBackend() {
    const nav = S.nav;
    const ok = await BK.ready();
    if (S.nav !== nav) return false;
    if (!ok) { view.innerHTML = msgCard(t("errUnavailable")); bind({ home: () => go(intro) }); }
    return ok;

  // ---------- intro ----------
  function intro() {
    ENV.route.write("");
    const mine = myClasses();
    view.innerHTML = `
      <section class="card">
        <h1>${t("introTitle")}</h1>
        <p class="muted">${t("introText")}</p>
        <div class="quad">${["D", "I", "C", "S"].map(k => `
          <div style="background:var(--${k})"><strong>${k}</strong>${P()[k].name}<br><small>${P()[k].short}</small></div>`).join("")}
        </div>
        <div class="row">
          <button class="btn" data-a="start">${t("start")}</button>

          `<button class="chip" data-a="open" data-code="${c.code}">${esc(c.name || c.code)} · ${c.code}</button>`).join("")}</div>` : ""}

  // ---------- quiz ----------
  function startQuiz() {
    S.idx = 0; S.answers = new Array(TOTAL).fill(null); S.lock = false;
    go(quiz);
  }
  function quiz() {
    const n = S.idx, pct = Math.round(n / TOTAL * 100);
    view.innerHTML = `
      <section class="card">
        ${S.cls ? `<div class="badge">${t("classBadge", { c: esc(S.cls.name), n: esc(S.cls.nick) })}</div>` : ""}
        <div class="row between">
          <span class="qcount">${t("qOf", { n: n + 1, t: TOTAL })}</span><span class="qcount">${pct}%</span>
        </div>
        <div class="progress"><i style="width:${pct}%"></i></div>
        <div class="qtext">${L().q[n]}</div>
        <div class="scale">${L().scale.map((l, i) =>
          `<button data-a="pick" data-v="${i + 1}" class="${S.answers[n] === i + 1 ? "sel" : ""}"><span class="dot"></span>${l}</button>`).join("")}
        </div>
        <div class="row between" style="margin-top:24px">
          <button class="btn ghost" data-a="back">${t("back")}</button>
          <span class="muted small hide-mobile">${t("keysTip")}</span>
        </div>
      </section>`;
    bind({
      pick: el => choose(+el.dataset.v),
      back: () => {
        if (S.idx > 0) { S.idx--; quiz(); }
        else go(S.cls ? () => joinView(S.cls.code) : intro);
      }
    });
  }
  function choose(v) {
    if (S.lock) return;
    S.lock = true;
    S.answers[S.idx] = v;
    view.querySelectorAll("[data-v]").forEach(b => b.classList.toggle("sel", +b.dataset.v === v));
    setTimeout(() => {
      S.lock = false;
      if (S.idx < TOTAL - 1) { S.idx++; quiz(); } else finish();
    }, 180);
  }
  document.addEventListener("keydown", e => {
    if (S.render !== quiz || e.target.tagName === "INPUT") return;
    if (e.key >= "1" && e.key <= "5") choose(+e.key);
    if (e.key === "ArrowLeft") S.actions.back();
  });

  function finish() {
    const raw = { D: 0, I: 0, S: 0, C: 0 };
    S.answers.forEach((v, i) => { raw[keyOf(i)] += v; });
    const sc = {};
    ORDER.forEach(k => { sc[k] = Math.round((raw[k] - 7) / 28 * 100); }); // 7 items × 1–5 → 0–100
    LS.set(STORE, sc);
    if (S.cls) {
      const cls = S.cls;
      go(() => results(sc, cls));
      submit(sc, cls);
    } else {
      ENV.route.write("");
      go(() => results(sc));
    }
  }
  async function submit(sc, cls) {
    S.submit = "saving"; updateStatus(cls);
    try {
      await BK.join(cls.code, memberRec(cls.code), sc);
      S.submit = "saved";
    } catch (e) {
      S.submit = e.code === "full" ? "full" : e.code === "perm" ? "perm" : "error";
    }
    updateStatus(cls);
  }
  function statusHTML(cls) {
    const boardBtn = `<button class="btn small" data-a="board">${t("viewBoard")}</button>`;
    if (S.submit === "saving") return `<p>⏳ ${t("saving")}</p>`;
    if (S.submit === "saved") return `<p>✅ ${t("saved", { c: esc(cls.name) })}</p>${boardBtn}`;
    if (S.submit === "full") return `<p>⚠️ ${t("errFull")}</p>${boardBtn}`;
    if (S.submit === "perm") return `<p>⚠️ ${t("errPerm")}</p>${boardBtn}`;
    return `<p>⚠️ ${t("errSave")}</p><div class="row"><button class="btn small" data-a="retry">${t("retry")}</button>${boardBtn}</div>`;
  }
  function updateStatus(cls) { const el = $("#clsStatus"); if (el) el.innerHTML = statusHTML(cls); }

  // ---------- results ----------
  function results(sc, cls = null, shared = false) {
    if (!sc) return go(intro);
    const [p1, p2] = rank(sc);
    const prof = P()[p1];
    const close = sc[p1] - sc[p2] <= 12;
    const total = ORDER.reduce((a, k) => a + sc[k], 0) || 1;
    const share = k => Math.round(sc[k] / total * 100);
    const list = arr => `<ul>${arr.map(x => `<li>${x}</li>`).join("")}</ul>`;

    view.innerHTML = `
      ${cls ? `<section class="card status noprint" id="clsStatus">${statusHTML(cls)}</section>` : ""}
      <div class="hero" style="background:var(--${p1})">
        <div class="tag">${shared ? t("sharedResult") + " · " : ""}${cls ? esc(cls.nick) + " · " : ""}${t("primary")}</div>
        <h1>${p1} — ${prof.nick}</h1>
        <p style="margin:0;opacity:.95">${prof.summary}</p>
      </div>

      <section class="card">
        <h2>${t("scoresTitle")}</h2>

        <div class="grid2" style="align-items:center">
          <div class="bars">${ORDER.map(k => `
            <div class="bar">
              <label><span>${k} · ${P()[k].name}</span><span>${sc[k]}</span></label>
              <div class="track"><div class="fill" data-w="${sc[k]}" style="background:var(--${k})"></div></div>
            </div>`).join("")}
          </div>
          ${wheel(sc)}
        </div>
      </section>

      <section class="card">
        <h2>${t("blend")}: ${p1}${p2} <span class="pill" style="background:var(--${p2})">${t("secondary")} ${p2}</span></h2>
        <p>${L().blends[p1 + p2]}</p>
        <p class="muted" style="margin:0">${close ? t("closeMsg", { a: p1, b: p2 }) : t("clearMsg", { a: p1, b: p2, p: share(p1) })}</p>
      </section>

      <div class="grid2">
        <section class="card"><h3 style="margin-top:0">${t("strengths")}</h3>${list(prof.strengths)}</section>
        <section class="card"><h3 style="margin-top:0">${t("watch")}</h3>${list(prof.blind)}</section>
        <section class="card"><h3 style="margin-top:0">${t("motiv")}</h3>${list(prof.motiv)}</section>
        <section class="card"><h3 style="margin-top:0">${t("comm")}</h3>${list(prof.comm)}</section>
      </div>

      <section class="card">
        <h3 style="margin-top:0">${t("stress")}</h3>
        <p>${prof.stress}</p>
        <h3>${t("careers", { k: p1 })}</h3>
        <p style="margin:0">${prof.careers}</p>
      </section>

      <section class="card">
        <h2>${t("others")}</h2>
        ${rank(sc).slice(1).map(k => `
          <h3><span class="pill" style="background:var(--${k})">${k}</span> ${P()[k].nick} · ${sc[k]}</h3>
          <p class="muted" style="margin:0">${P()[k].summary}</p>`).join("")}
      </section>

      <div class="row noprint">
        <button class="btn" data-a="share">${t("share")}</button>
        ${ENV.canPrint ? `<button class="btn ghost" data-a="print">${t("print")}</button>` : ""}
        <button class="btn ghost" data-a="retake">${t("retake")}</button>
      </div>
      <p class="muted noprint small" id="shareMsg"></p>`;

    requestAnimationFrame(() => setTimeout(() => {
      view.querySelectorAll(".fill").forEach(f => { f.style.width = f.dataset.w + "%"; });
    }, 60));

    bind({
      board: () => go(() => board(cls.code)),
      retry: () => submit(sc, cls),
      print: () => window.print(),
      retake: () => { S.cls = cls || null; startQuiz(); },
      share: async () => {
        const url = ENV.link("r", `${sc.D}-${sc.I}-${sc.S}-${sc.C}`);
        const text = t("shareText", { s: p1 + p2, n: prof.nick });
        try {
          if (ENV.canShare && navigator.share) { await navigator.share({ title: "DISC", text, url }); return; }
          await navigator.clipboard.writeText(url);
          $("#shareMsg").textContent = t("copied");
        } catch (e) { if (e.name !== "AbortError") $("#shareMsg").textContent = url; }
      }
    });
  }

  function wheel(sc) {
    const cx = 140, cy = 140, R = 120;
    // classic layout: D top-left, I top-right, S bottom-right, C bottom-left
    const angles = { D: [180, 270], I: [270, 360], S: [0, 90], C: [90, 180] };
    const pt = (a, r) => [cx + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)];
    let s = `<svg class="wheel" viewBox="0 0 280 280" role="img" aria-label="DISC">`;
    ORDER.forEach(k => {
      const [a0, a1] = angles[k];
      const [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R);
      s += `<path d="M${cx},${cy} L${x0},${y0} A${R},${R} 0 0 1 ${x1},${y1} Z" style="fill:var(--${k});opacity:.15"/>`;
      const r = 20 + (R - 20) * sc[k] / 100;
      const [u0, v0] = pt(a0, r), [u1, v1] = pt(a1, r);
      s += `<path d="M${cx},${cy} L${u0},${v0} A${r},${r} 0 0 1 ${u1},${v1} Z" style="fill:var(--${k});opacity:.9"/>`;
      const [lx, ly] = pt((a0 + a1) / 2, R - 18);
      s += `<text x="${lx}" y="${ly + 6}" text-anchor="middle" font-size="18" font-weight="800" fill="currentColor">${k}</text>`;
    });
    return s + `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="currentColor" stroke-opacity=".15"/></svg>`;
  }

  // ---------- join class ----------
  async function joinView(code) {

      view.innerHTML = `
        <section class="card">

          <p class="muted">${t("joinText")}</p>

        bind({ again: () => go(() => joinView(null)), home: () => go(intro) });

      }

    }

    const info = S.classes[code];
    const prev = memberRec(code)?.nick || "";
    view.innerHTML = `
      <section class="card">
        <p class="qcount" style="margin:0">${t("youJoin")}</p>
        <h1 style="margin:4px 0">${esc(info.name)}</h1>
        <p class="muted">${t("codeLabel")}: <b>${code}</b></p>
        <label class="lbl" for="nick">${t("nickLabel")}</label>
        <input id="nick" class="input" maxlength="20" autocomplete="nickname" placeholder="${esc(t("nickPh"))}" value="${esc(prev)}">
        <p class="hint">${t("nickHint")}</p>
        ${prev ? `<p class="hint"><button class="linkbtn" data-a="other">${t("notYou", { n: esc(prev) })}</button></p>` : ""}
        <p class="err" id="err"></p>

      startQuiz();

    inp.onkeydown = e => { if (e.key === "Enter") start(); };
    bind({
      go: start,
      board: () => go(() => board(code)),

    });

  // ---------- class board ----------
  async function board(code) {
    ENV.route.write("board", code);
    S.boardErr = null;
    const draw = () => drawBoard(code);
    S.render = draw;
    draw();
    const nav = S.nav;
    if (!(await needBackend()) || S.nav !== nav) return;
    if (S.unsub) S.unsub();
    S.unsub = BK.subscribe(code,
      d => {
        if (S.nav !== nav) return;
        const changed = JSON.stringify(d) !== JSON.stringify(S.boards[code]);
        S.boards[code] = d; S.classes[code] = { name: d.name }; S.boardErr = null;
        if (d.isAdmin) rememberClass(code, d.name);
        if (changed) draw();
      },
      err => {
        if (S.nav !== nav) return;
        S.boardErr = err;
        if (err === "notFound") delete S.boards[code];
        if (!S.boards[code]) draw();
      });
  }

  const pos = sc => [((sc.I + sc.S) - (sc.D + sc.C)) / 2, ((sc.D + sc.I) - (sc.S + sc.C)) / 2];
  const hash = s => { let h = 7; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) | 0; return h >>> 0; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const trunc = (s, n) => (s.length > n ? s.slice(0, n - 1) + "…" : s);

  function mapSVG(ms, me, avg, showNames) {
    const W = 400, c = 200, k = 1.7;
    const quad = (x, y, key) => `<rect x="${x}" y="${y}" width="200" height="200" style="fill:var(--${key});opacity:.13"/>`;
    const big = (x, y, key, anchor) => `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="40" font-weight="800" style="fill:var(--${key});opacity:.55">${key}</text>`;
    let o = `<svg class="map" viewBox="0 0 ${W} ${W}" role="img" aria-label="${esc(t("map"))}">`;
    o += quad(0, 0, "D") + quad(200, 0, "I") + quad(200, 200, "S") + quad(0, 200, "C");
    o += big(14, 72, "D", "start") + big(386, 72, "I", "end") + big(386, 376, "S", "end") + big(14, 376, "C", "start");
    o += `<path d="M200 0V400M0 200H400" stroke="currentColor" stroke-opacity=".18"/>`;
    o += `<text class="ax" x="200" y="16" text-anchor="middle">${esc(t("axTop"))}</text>`;
    o += `<text class="ax" x="200" y="393" text-anchor="middle">${esc(t("axBottom"))}</text>`;
    o += `<text class="ax" transform="translate(13 200) rotate(-90)" text-anchor="middle">${esc(t("axLeft"))}</text>`;
    o += `<text class="ax" transform="translate(387 200) rotate(90)" text-anchor="middle">${esc(t("axRight"))}</text>`;
    const [ax, ay] = pos(avg);
    const axp = c + ax * k, ayp = c - ay * k;
    o += `<path d="M${axp} ${ayp - 11}L${axp + 11} ${ayp}L${axp} ${ayp + 11}L${axp - 11} ${ayp}Z" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2"><title>${esc(t("avg"))}</title></path>`;

    const sorted = ms.slice().sort((a, b) => (a.id === me) - (b.id === me));
    const pts = sorted.map(m => {
      const [x, y] = pos(m.scores); const h = hash(m.id);
      const jx = ((h & 255) / 255 - 0.5) * 12, jy = (((h >> 8) & 255) / 255 - 0.5) * 12;
      const mine = m.id === me;
      const label = showNames ? m.nick : (mine ? t("you") : "");
      return { m, mine, label, px: clamp(c + x * k + jx, 26, 374), py: clamp(c - y * k + jy, 34, 374) };
    });
    // spread dots that sit on top of each other
    for (let it = 0; it < 30; it++) {
      let moved = false;
      for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
        const a = pts[i], b = pts[j], dx = b.px - a.px, dy = b.py - a.py, d = Math.hypot(dx, dy);
        if (d < 18) {
          const ang = d ? Math.atan2(dy, dx) : (hash(b.m.id) % 628) / 100, push = (18 - d) / 2;
          a.px -= Math.cos(ang) * push; a.py -= Math.sin(ang) * push;
          b.px += Math.cos(ang) * push; b.py += Math.sin(ang) * push; moved = true;
        }
      }
      pts.forEach(q => { q.px = clamp(q.px, 26, 374); q.py = clamp(q.py, 34, 374); });
      if (!moved) break;
    }
    // place each name above its dot, or below / beside it if that spot is taken
    const boxes = [];
    pts.forEach(q => {
      if (!q.label) return;
      const w = Math.min(q.label.length, 12) * 7 + 6;
      const tries = [[0, -12], [0, 20], [w / 2 + 10, 4], [-w / 2 - 10, 4], [0, -24], [0, 32]];
      let best = tries[0];
      for (const [ox, oy] of tries) {
        const bx = q.px + ox, by = q.py + oy;
        if (!boxes.some(b => Math.abs(b.x - bx) < (b.w + w) / 2 && Math.abs(b.y - by) < 13)) { best = [ox, oy]; break; }
      }
      q.lx = q.px + best[0]; q.ly = q.py + best[1]; boxes.push({ x: q.lx, y: q.ly, w });
    });
    o += pts.map(({ m, mine, label, px, py, lx, ly }) => {
      const [p1, p2] = rank(m.scores);
      const tip = showNames || mine ? `${esc(m.nick)} · ${p1}${p2}` : `${p1}${p2}`;
      return `<g><circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${mine ? 9 : 7}" style="fill:var(--${p1})"
        stroke="${mine ? "currentColor" : "#fff"}" stroke-width="${mine ? 3 : 1.5}"/>
        ${label ? `<text class="nm" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle">${esc(trunc(label, 12))}</text>` : ""}
        <title>${tip}</title></g>`;
    }).join("");
    return o + `</svg>`;
  }

  // QR code as crisp SVG (always dark-on-white so every phone camera can read it)
  function qrSVG(text) {
    if (typeof qrcode !== "function") return "";
    const qr = qrcode(0, "M");
    qr.addData(text, "Byte"); qr.make();
    const n = qr.getModuleCount(), m = 4;
    let d = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
    return `<svg viewBox="0 0 ${n + 2 * m} ${n + 2 * m}" shape-rendering="crispEdges" role="img" aria-label="QR">
      <rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }
  function showQR(link, name, code) {
    const el = document.createElement("div");
    el.className = "qr-overlay";
    el.innerHTML = `<div class="qr-big">${qrSVG(link)}</div>
      <div class="qr-name">${esc(name)}</div><div class="code">${code}</div>
      <p class="hint">${t("scanHint")}</p><p class="hint">${t("closeHint")}</p>`;
    const close = () => { el.remove(); document.removeEventListener("keydown", onKey); };
    const onKey = e => { if (e.key === "Escape") close(); };
    el.onclick = close;
    document.addEventListener("keydown", onKey);
    document.body.appendChild(el);
  }

  function drawBoard(code) {
    const d = S.boards[code];
    if (!d) {
      view.innerHTML = S.boardErr
        ? msgCard(S.boardErr === "notFound" ? t("errNotFound") : t("errNet"), `<button class="btn" data-a="retry">${t("retry")}</button>`)
        : loadingCard();
      bind({ retry: () => go(() => board(code)), home: () => go(intro) });
      return;
    }
    const me = memberRec(code)?.id;
    const ms = d.members;
    const n = ms.length;
    const link = ENV.link("join", code);
    const counts = { D: 0, I: 0, S: 0, C: 0 };
    ms.forEach(m => { counts[rank(m.scores)[0]]++; });
    const avg = {};
    ORDER.forEach(k => { avg[k] = n ? Math.round(ms.reduce((a, m) => a + m.scores[k], 0) / n) : 0; });
    const bar = (k, label, w) => `
      <div class="bar"><label><span>${k} · ${P()[k].name}</span><span>${label}</span></label>
      <div class="track"><div class="fill" style="width:${w}%;background:var(--${k})"></div></div></div>`;
    const people = ms.slice().sort((a, b) => a.nick.localeCompare(b.nick));

    view.innerHTML = `
      <section class="card">
        <div class="qcount">${t("board")}</div>
        <h1 style="margin:4px 0">${esc(d.name)}</h1>
        <p class="muted" style="margin:0">${t("members", { n })} · <span class="live">● ${t("autoRefresh")}</span></p>
        <div class="invite">
          <button class="qrbox" data-a="bigqr" aria-label="${esc(t("bigQR"))}">${qrSVG(link)}</button>
          <div class="invite-info">
            <span class="lbl">${t("scanTitle")}</span>
            <p class="hint" style="margin-top:0">${t("scanHint")}</p>
            <span class="lbl">${t("codeLabel")}</span>
            <div class="code">${code}</div>
            <button class="btn small" data-a="bigqr" style="margin-top:10px">⛶ ${t("bigQR")}</button>
            <details class="linkdetails">
              <summary>${t("orLink")}</summary>
              <div class="row nowrap"><input class="input" id="lnk" readonly value="${esc(link)}"><button class="btn small" data-a="copy">${t("copyLink")}</button></div>
            </details>
          </div>
        </div>
        <div class="row">
          <button class="btn" data-a="take">${me ? t("retakeClass") : t("takeTest")}</button>
          <button class="btn ghost" data-a="home">${t("home")}</button>
        </div>
      </section>
      ${n ? `
      <section class="card">
        <h2>${t("map")}</h2>
        <p class="muted">${t("mapText")}</p>
        ${mapSVG(ms, me, avg, d.showNames)}
        <div class="legend">${t("legend")}</div>
        <p class="hint" style="text-align:center">🔒 ${t("privacyNote")}</p>
      </section>
      <div class="grid2">
        <section class="card"><h2>${t("breakdown")}</h2><div class="bars">
          ${ORDER.map(k => bar(k, `${counts[k]} (${Math.round(counts[k] / n * 100)}%)`, counts[k] / n * 100)).join("")}
        </div></section>
        <section class="card"><h2>${t("avg")}</h2><div class="bars">
          ${ORDER.map(k => bar(k, avg[k], avg[k])).join("")}
        </div></section>
      </div>` : `<section class="card"><p class="muted" style="margin:0">${t("empty")}</p></section>`}
      ${d.isAdmin ? `
      <section class="card">
        <h2>🔑 ${t("teacherTools")}</h2>
        <label class="toggle"><input type="checkbox" data-a="names" ${d.showNames ? "checked" : ""}> ${t("showNames")}</label>
        ${n ? `<p class="lbl">${t("participants")}</p>
        <p class="hint" style="margin-bottom:10px">${t("participantsHint")}</p>
        <div class="chips">${people.map(m => S.confirmId === m.id
          ? `<button class="chip danger" data-a="del" data-id="${esc(m.id)}">${t("confirmShort", { n: esc(m.nick) })}</button>`
          : `<button class="chip" data-a="ask" data-id="${esc(m.id)}">${esc(m.nick)} <span class="muted">✕</span></button>`).join("")}</div>` : ""}
      </section>` : ""}`;

    bind({
      copy: async el => {
        try { await navigator.clipboard.writeText(link); }
        catch (e) { const i = $("#lnk"); i.select(); try { document.execCommand("copy"); } catch (x) {} }
        el.textContent = "✓"; setTimeout(() => { el.textContent = t("copyLink"); }, 1500);
      },
      take: () => go(() => joinView(code)),
      home: () => go(intro),
      bigqr: () => showQR(link, d.name, code),
      names: async el => {
        try { await BK.setShowNames(code, el.checked); } catch (e) { el.checked = !el.checked; }
      },
      ask: el => { S.confirmId = el.dataset.id; drawBoard(code); },
      del: async el => {
        S.confirmId = null;
        el.disabled = true;
        try { await BK.remove(code, el.dataset.id); } catch (e) {}
        drawBoard(code);
      }
    });
  }

  // ---------- boot ----------
  document.querySelectorAll("[data-lang]").forEach(b => { b.onclick = () => setLang(b.dataset.lang); });
  $("[data-home]").onclick = e => { e.preventDefault(); go(intro); };
  setLang(lang, false);

  function route() {
    const { kind, val } = ENV.route.read();
    const code = (val || "").toUpperCase();
    if (kind === "board" && CODE_RE.test(code)) return go(() => board(code));
    if (kind === "join" && CODE_RE.test(code)) return go(() => joinView(code));
    if (kind === "r") {
      const s = (val || "").split("-").map(Number);
      if (s.length === 4 && s.every(x => Number.isInteger(x) && x >= 0 && x <= 100))
        return go(() => results({ D: s[0], I: s[1], S: s[2], C: s[3] }, null, true));
    }
    go(intro);
  }
  route();
  if (ENV.onRouteChange) ENV.onRouteChange(route);
})();
</script>
</body>
</html>
